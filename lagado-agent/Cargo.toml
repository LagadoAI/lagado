[package]
name = "lagado-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio-tungstenite = "0.24"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
directories = "5"
log = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hostname = "0.3"
hex = "0.4"
blake3 = "1"
nix = { version = "0.27", features = ["fs", "process", "term", "ioctl"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
cc = "1"

[[bin]]
name = "lagado-agent"
path = "src/main.rs"
test = false   # CLI entry point has no unit tests; lib tests cover the crate

[dev-dependencies]
tempfile = "3"
