name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:        # docs / experiments / provisioning don't need cross-platform CI
      - '**.md'
      - 'docs/**'
      - 'LAPUTA HOW TO/**'
      - 'vm-provision/**'
  pull_request:
  workflow_dispatch:     # run the full matrix on demand from the Actions tab

jobs:
  agent:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: lagado-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
